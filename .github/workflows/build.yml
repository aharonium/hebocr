name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # Publishing a release on GitHub builds it and attaches the downloads.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-libtiff
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-imageformats

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package hebocr.exe and hebocr-gui.exe with their DLLs
        run: |
          mkdir -p dist
          cp build/hebocr.exe build/hebocr-gui.exe dist/
          # Qt libraries and plugins (the tool's name varies between Qt packagings)
          for tool in windeployqt-qt6 windeployqt6 windeployqt; do
            if command -v $tool >/dev/null 2>&1; then
              $tool --release --no-translations --no-system-d3d-compiler \
                --no-opengl-sw dist/hebocr-gui.exe && break
            fi
          done
          test -d dist/platforms || { echo "Qt deployment failed"; exit 1; }
          # every other DLL the programs and Qt plugins need from MSYS2
          for f in dist/*.exe dist/*.dll dist/*/*.dll; do
            ldd "$f" | awk '{print $3}' | grep -i '^/ucrt64/' || true
          done | sort -u | xargs -r -I{} cp -n {} dist/
          cp COPYING README README.windows.txt dist/
          cp docs/options.md dist/options-guide.md
          cp CHANGELOG.md docs/third-party.md dist/

      - name: Collect licenses of bundled libraries
        run: |
          # every DLL in the package comes from an MSYS2 package; record
          # each package's version, home page and license, and copy its
          # license files
          mkdir -p dist/licenses
          : > pkgs.txt
          for f in dist/*.dll; do
            b=$(basename "$f")
            if [ -f "/ucrt64/bin/$b" ]; then
              pacman -Qqo "/ucrt64/bin/$b" >> pkgs.txt 2>/dev/null || true
            fi
          done
          # Qt plugins live in subfolders; their packages:
          echo mingw-w64-ucrt-x86_64-qt6-base >> pkgs.txt
          echo mingw-w64-ucrt-x86_64-qt6-imageformats >> pkgs.txt
          sort -u pkgs.txt -o pkgs.txt
          {
            echo "Third-party software in the hebOCR Windows package"
            echo "=================================================="
            echo
            echo "hebOCR itself is licensed under the GNU GPL, version 3 or later"
            echo "(COPYING). The libraries below are bundled with it; each is used"
            echo "under its own license. License texts are in the licenses folder."
            echo "See also third-party.md."
            echo
            while read -r p; do
              pacman -Qi "$p" | grep -E '^(Name|Version|URL|Licenses)' || true
              echo
            done < pkgs.txt
          } > dist/THIRD-PARTY-NOTICES.txt
          while read -r p; do
            short=${p#mingw-w64-ucrt-x86_64-}
            pacman -Qlq "$p" | grep '/share/licenses/.*[^/]$' | while read -r lf; do
              mkdir -p "dist/licenses/$short"
              cp "$lf" "dist/licenses/$short/"
            done || true
          done < pkgs.txt
          echo "packages: $(wc -l < pkgs.txt); license folders: $(ls dist/licenses | wc -l)"
          if [ ! -d dist/licenses/libtiff ]; then
            echo "::warning::no license files found for libtiff"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: hebocr-windows-x64
          path: dist/

      - name: Attach zip to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $zip = "hebocr-$tag-windows-x64.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip
          gh release upload $tag $zip --clobber

  linux:
    name: Linux (AppImage)
    # pinned: package names below are those of Ubuntu 24.04. The AppImage
    # runs on distributions at least as new (glibc 2.39 or later).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LINUXDEPLOY_VERSION: 1-alpha-20251107-1
      LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
      LINUXDEPLOY_QT_VERSION: 1-alpha-20250213-1
      LINUXDEPLOY_QT_SHA256: 15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 cmake ninja-build pkg-config libglib2.0-dev libtiff-dev qt6-base-dev qt6-image-formats-plugins libgl-dev xvfb xauth

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          QMAKE: /usr/lib/qt6/bin/qmake6
        run: |
          DESTDIR=AppDir cmake --install build
          rm -f AppDir/usr/lib/libhebocr.a
          rm -rf AppDir/usr/include
          curl -sSfL -o linuxdeploy-x86_64.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/$LINUXDEPLOY_VERSION/linuxdeploy-x86_64.AppImage"
          curl -sSfL -o linuxdeploy-plugin-qt-x86_64.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/$LINUXDEPLOY_QT_VERSION/linuxdeploy-plugin-qt-x86_64.AppImage"
          echo "$LINUXDEPLOY_SHA256  linuxdeploy-x86_64.AppImage" | sha256sum -c -
          echo "$LINUXDEPLOY_QT_SHA256  linuxdeploy-plugin-qt-x86_64.AppImage" | sha256sum -c -
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/hebocr \
            --executable AppDir/usr/bin/hebocr-gui \
            --desktop-file AppDir/usr/share/applications/hebocr.desktop \
            --icon-file gui/icons/hebocr-256.png --icon-filename hebocr \
            --plugin qt
          # license notices for every bundled library, from the Ubuntu
          # package it came from
          notices=AppDir/usr/share/doc/hebocr
          mkdir -p "$notices/licenses"
          cp COPYING CHANGELOG.md docs/third-party.md "$notices/"
          : > pkgs.txt
          find AppDir/usr/lib AppDir/usr/plugins -name '*.so*' -type f | while read -r f; do
            b=$(basename "$f")
            orig=$(find /usr/lib /lib -name "$b" 2>/dev/null | head -1)
            if [ -n "$orig" ]; then
              dpkg -S "$orig" 2>/dev/null | head -1 | cut -d: -f1 >> pkgs.txt || true
            fi
          done
          sort -u pkgs.txt -o pkgs.txt
          {
            echo "Third-party software in the hebOCR AppImage"
            echo "==========================================="
            echo
            echo "hebOCR itself is licensed under the GNU GPL, version 3 or later"
            echo "(COPYING). The libraries below, from Ubuntu 24.04 packages, are"
            echo "bundled with it; each is used under its own license. Copyright and"
            echo "license texts are in the licenses folder. See also third-party.md."
            echo
            while read -r p; do
              dpkg-query -W -f='${Package} ${Version}  ${Homepage}\n' "$p" 2>/dev/null || echo "$p"
              if [ -f "/usr/share/doc/$p/copyright" ]; then
                mkdir -p "$notices/licenses/$p"
                cp "/usr/share/doc/$p/copyright" "$notices/licenses/$p/"
              fi
            done < pkgs.txt
          } > "$notices/THIRD-PARTY-NOTICES.txt"
          echo "packages: $(wc -l < pkgs.txt); license folders: $(ls "$notices/licenses" | wc -l)"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          mv hebOCR-x86_64.AppImage hebocr-x86_64.AppImage
          ls -l hebocr-x86_64.AppImage

      - name: Test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          xvfb-run -a ./hebocr-x86_64.AppImage --version
          xvfb-run -a -s "-screen 0 1600x1000x24" ./hebocr-x86_64.AppImage \
            --screenshot appimage-test.png tests/images/genesis_nikud.png

      - uses: actions/upload-artifact@v4
        with:
          name: hebocr-linux-x86_64-appimage
          path: hebocr-x86_64.AppImage

      - name: Attach AppImage to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          cp hebocr-x86_64.AppImage "hebocr-$tag-x86_64.AppImage"
          gh release upload "$tag" "hebocr-$tag-x86_64.AppImage" --clobber
