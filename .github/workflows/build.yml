name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # Publishing a release on GitHub builds it and attaches the downloads.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-libtiff
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-imageformats

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package hebocr.exe and hebocr-gui.exe with their DLLs
        run: |
          mkdir -p dist
          cp build/hebocr.exe build/hebocr-gui.exe dist/
          # Qt libraries and plugins (the tool's name varies between Qt packagings)
          for tool in windeployqt-qt6 windeployqt6 windeployqt; do
            if command -v $tool >/dev/null 2>&1; then
              $tool --release --no-translations --no-system-d3d-compiler \
                --no-opengl-sw dist/hebocr-gui.exe && break
            fi
          done
          test -d dist/platforms || { echo "Qt deployment failed"; exit 1; }
          # every other DLL the programs and Qt plugins need from MSYS2
          for f in dist/*.exe dist/*.dll dist/*/*.dll; do
            ldd "$f" | awk '{print $3}' | grep -i '^/ucrt64/' || true
          done | sort -u | xargs -r -I{} cp -n {} dist/
          cp COPYING README README.windows.txt dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: hebocr-windows-x64
          path: dist/

      - name: Attach zip to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $zip = "hebocr-$tag-windows-x64.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip
          gh release upload $tag $zip --clobber

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libglib2.0-dev libtiff-dev qt6-base-dev qt6-image-formats-plugins libgl-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - uses: actions/upload-artifact@v4
        with:
          name: hebocr-linux-x64
          path: |
            build/hebocr
            build/hebocr-gui

      - name: Attach tarball to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          mkdir -p "hebocr-$tag-linux-x64"
          cp build/hebocr build/hebocr-gui COPYING README "hebocr-$tag-linux-x64/"
          tar czf "hebocr-$tag-linux-x64.tar.gz" "hebocr-$tag-linux-x64"
          gh release upload "$tag" "hebocr-$tag-linux-x64.tar.gz" --clobber
